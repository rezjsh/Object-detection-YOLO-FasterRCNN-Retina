[project]
name = "object-detection-suite"
version = "0.1.0"
description = "A modular multi-model (YOLO-style / Faster R-CNN / RetinaNet) object detection pipeline: train, evaluate, and serve from one shared codebase."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "opencv-python>=4.9.0",
    "albumentations>=1.4.0",
    "pyyaml>=6.0.1",
    "pydantic>=2.6.0",
    "streamlit>=1.32.0",
    "tqdm>=4.66.0",
    "numpy>=1.24.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.20.0",
    "roboflow>=1.1.0",
    "mlflow>=2.11.0",
    "pillow>=10.0.0",
    "requests[socks]>=2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "black>=24.0.0",
    "flake8>=7.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/object_detection_suite"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
